name: Build Integrated App

on:
  workflow_dispatch:
    inputs:
      windows:
        description: 'Also build Windows in Actions (normally built locally)'
        type: boolean
        default: false
      version:
        description: 'Version supplied by the local CMD build'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  packages:
    uses: ./.github/workflows/build.yml
    with:
      windows: ${{ inputs.windows }}
      version: ${{ inputs.version }}
      macos_arm64: true
      macos_x64: true
      linux: false
      release: true
      prerelease: false
    secrets: inherit
