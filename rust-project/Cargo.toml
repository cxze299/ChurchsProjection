[workspace]
resolver = "2"
members = [
    "crates/cp-core",
    "crates/cp-bible",
    "crates/cp-library",
    "crates/cp-app",
]

[workspace.package]
version = "1.0.6"
edition = "2021"
license = "GPL-3.0"
authors = ["ChurchPresenter"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
thiserror = "2.0"
log = "0.4"
walkdir = "2.5"
pinyin = "0.10"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sha2 = "0.10"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "persistence", "x11", "wayland"] }
egui = "0.31"
egui_extras = { version = "0.31", features = ["all_loaders"] }
rfd = "0.15"
